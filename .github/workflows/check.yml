name: Validate workflow records

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_node.py examples/report-layout/N03
      - run: python -m unittest discover -s tests -v
